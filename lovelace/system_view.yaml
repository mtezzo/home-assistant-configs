title: System
icon: mdi:tune
path: system
cards:
  - type: vertical-stack
    cards:
      - type: button
        show_name: true
        show_icon: true
        show_state: true
        tap_action:
          action: toggle
        entity: input_boolean.guest_mode
        uix:
          class: button-lozenge-right

      - type: button
        show_name: true
        show_icon: true
        show_state: true
        tap_action:
          action: toggle
        entity: input_boolean.lcars_texture
        uix:
          class: button-lozenge-left

      - type: button
        show_name: true
        show_icon: true
        show_state: true
        tap_action:
          action: toggle
        entity: input_boolean.lcars_sound
        uix:
          class: button-lozenge-left

      - type: markdown
        content: "# Automations"
        uix:
          class: header-right

      - type: entities
        title: Lighting
        show_header_toggle: false
        entities:
          - automation.master_bedroom_motion
          - automation.exterior_lighting
          - automation.holiday_lighting
          - automation.auto_sunrise
          - input_datetime.auto_sunrise_time
        uix:
          class: middle-right

      - type: entities
        title: Presence
        show_header_toggle: false
        entities:
          - automation.auto_away
          - automation.auto_home
        uix:
          class: middle-right

      - type: entities
        title: Time Based
        show_header_toggle: false
        entities:
          - automation.auto_morning
          - automation.auto_evening
          - automation.auto_night_weekday
          - automation.auto_night_weekend
          # - automation.set_theme_based_on_sun
        uix:
          class: middle-right

      - type: entities
        title: Notifications
        show_header_toggle: false
        entities:
          - automation.startup_notification
          - automation.alarm_triggered_notification
          - automation.update_notification
          - automation.trigger_notification_on_sensor_tamper
          - automation.trigger_notification_on_smoke
          - automation.trigger_notification_on_co
        uix:
          class: middle-right

      - type: entities
        title: Security
        show_header_toggle: false
        entities:
          - automation.trigger_alarm_on_exterior_door
          - automation.trigger_alarm_on_binary_sensor
          - automation.guest_mode_disarm
          - automation.guest_mode_restore
        uix:
          class: middle-right

      - type: entities
        title: Manual Controls
        show_header_toggle: false
        entities:
          - automation.nightstand_switches
          - automation.garage_switch
          - automation.manual_night
        uix:
          class: footer-right

  - type: vertical-stack
    cards:
      - type: markdown
        content: "# System Diagnostics"
        uix:
          class: header-left

      - type: entities
        title: Hardware Status
        show_header_toggle: false
        entities:
          - sensor.date
          - sensor.time
          - sensor.processor_use
          - sensor.disk_use_percent
          - sensor.memory_use_percent
          - sensor.last_boot
          - sensor.load_1m
          - sensor.load_5m
          - sensor.load_15m
          - sensor.current_version
          - update.home_assistant_core_update
          - sensor.speedtest_ping
          - sensor.speedtest_download
          - sensor.speedtest_upload
        uix:
          class: middle-left

      - type: markdown
        content: "# Resource Utilization"
        uix:
          class: middle-left

      - type: custom:mini-graph-card
        name: Resources
        icon: mdi:server
        entities:
          - entity: sensor.processor_use
            name: CPU
          - entity: sensor.memory_use_percent
            name: MEM
          - entity: sensor.disk_use_percent
            name: DISK
        uix:
          class: middle-left

      - type: markdown
        content: "# Z-Wave Network"
        uix:
          class: middle-left

      - type: entities
        show_header_toggle: false
        entities:
          - sensor.controller_status
          - sensor.controller_average_background_rssi_channel_0
          - sensor.controller_average_background_rssi_channel_1
          - sensor.controller_average_background_rssi_channel_2
          - sensor.controller_collisions
          - sensor.controller_missing_acks
          - sensor.controller_messages_dropped_rx
          - sensor.controller_messages_dropped_tx
          - sensor.controller_messages_not_accepted
          - sensor.controller_timed_out_callbacks
          - sensor.controller_timed_out_responses
        uix:
          class: middle-left

      - type: markdown
        content: "# Failing Batteries"
        uix:
          class: middle-left

      - type: custom:auto-entities
        card:
          type: entities
          show_header_toggle: false
          uix:
            class: footer-left
        filter:
          include:
            - domain: sensor
              entity_id: "*battery_level"
              state: "<= 20"
            - attributes:
                battery_level: "<= 20" # Attribute battery_level is 20 or less
        else:
          type: markdown
          content: "# None"
          uix:
            class: footer-left
            style: |
              ha-card {
                padding-left: 18px !important;
              }
