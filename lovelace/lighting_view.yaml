title: Lighting Subsystem
icon: mdi:lightbulb-outline
path: lighting
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        uix:
          class: bar-large-left
        content: 'Lighting Subsystem'

      - type: button
        name: All Lights Off
        icon: mdi:lamps
        show_name: true
        show_icon: true
        show_state: false
        tap_action:
          action: call-service
        service: script.all_interior_lights_off
        uix:
          class: button-lozenge-right

      - type: markdown
        uix:
          class: header-right
        content: "# On Now"
      - type: custom:auto-entities
        card:
          type: entities
          show_header_toggle: false
          uix:
            class: middle-blank
            style: |
              :host{
                --lcars-readout-width: 125px;
                --lcars-vertical-border: 40px;
              }
        filter:
          include:
            - domain: light
              state: "on"
              options:
                uix:
                  class: entity-barrel-right
            - entity_id: switch.driveway_lights
              state: "on"
              options:
                uix:
                  class: entity-barrel-right
            - entity_id: switch.master_bedroom_outlet_switch
              state: "on"
              options:
                uix:
                  class: entity-barrel-right
          exclude:
            - entity_id: light.basement_overhead_lights
            - entity_id: light.basement_staircase_lights
            - entity_id: light.rear_basement_overhead_lights
            - entity_id: light.exterior_lights
            - entity_id: light.interior_lights
            - entity_id: light.dining_room_hutch_light_indicator
            - entity_id: light.christmas_tree_switch_indicator
            - entity_id: '/^light\.hue_(?!basement_billiard$|!basement_lounge$|!basement_stairs$|!front_yard$|!fireplace_light$).*$/'
            - entity_id: switch.driveway_lights
        sort:
          method: friendly_name
        else:
          type: markdown
          content: "*Everything's off.*"
          uix:
            class: middle-right
      - type: markdown
        content: "# &nbsp;"
        uix:
          class: footer-right
          style: |
            :host {
              --lcars-readout-width: 125px;
            }

      - type: markdown
        uix:
          class: bar-right
        content: "Basement"
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.hue_basement_lounge
            vertical: true
            name: "Overhead"
            features:
              - type: "light-brightness"
            uix: &tile_style
              style: |
                ha-card.type-tile {
                  border-radius: 20px !important;
                  text-transform: uppercase;
                  {% if is_state(config.entity, 'on') %}
                  background: color-mix(in srgb, var(--lcars-card-button-color) 35%, var(--lcars-gold) 65%) !important;
                  box-shadow: 0 0 10px 1px var(--lcars-gold);
                  {% else %}
                  background: color-mix(in srgb, var(--lcars-card-button-color) 60%, black 40%) !important;
                  {% endif %}
                }
          - type: tile
            entity: light.hue_basement_billiard
            vertical: true
            name: "Rear Overhead"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: light.basement_track_lights
            vertical: true
            name: "Track Lights"
            features:
              - type: "light-brightness"
            uix: *tile_style
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.pool_table_light
            vertical: true
            name: "Pool Table"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: light.workroom_light
            vertical: true
            name: "Workroom Light"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: light.hue_smart_plug_dino_light
            vertical: true
            name: "Dino"
            uix: *tile_style
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.hue_workroom_closet_light
            vertical: true
            name: "Workroom Closet"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: light.hue_basement_sump_pump_closet_light
            vertical: true
            name: "Sump Closet"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: light.hue_basement_stair_closet_light
            vertical: true
            name: "Stair Closet"
            features:
              - type: "light-brightness"
            uix: *tile_style

      - type: markdown
        uix:
          class: bar-right
        content: "Dining Room"
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.dining_room_light
            vertical: true
            name: "Chandelier"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: light.dining_room_hutch_light
            vertical: true
            name: "Hutch"
            uix: *tile_style

  - type: vertical-stack
    cards:
      - type: markdown
        uix:
          class: bar-right
        content: "Kitchen"
      - type: tile
        entity: light.kitchen_lights
        vertical: true
        name: "Overhead"
        features:
          - type: "light-brightness"
        uix: *tile_style

      - type: markdown
        uix:
          class: bar-right
        content: "Master Bedroom"
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.master_bedroom_overhead_light
            vertical: true
            name: "Overhead"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: switch.master_bedroom_outlet_switch
            vertical: true
            name: "Outlets"
            uix: *tile_style


      - type: markdown
        uix:
          class: bar-right
        content: "Office"
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.office_bookshelf_lamp
            vertical: true
            name: "Bookshelf"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: light.left_key_light_air
            vertical: true
            name: "Left Key Light"
            features:
              - type: "light-brightness"
            uix: *tile_style
          - type: tile
            entity: light.right_key_light_air
            vertical: true
            name: "Right Key Light"
            features:
              - type: "light-brightness"
            uix: *tile_style

      - type: markdown
        uix:
          class: bar-right
        content: "Outdoors"
      - type: horizontal-stack
        cards:
          - type: tile
            entity: light.back_porch_light
            vertical: true
            name: "Back Porch"
            uix: *tile_style
          - type: tile
            entity: light.front_porch_light
            vertical: true
            name: "Front Porch"
            uix: *tile_style
      - type: tile
        entity: switch.driveway_lights
        vertical: true
        name: "Driveway"
        uix: *tile_style
