title: Security Subsystem
icon: mdi:shield-home
path: security
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        content: "# Security Subsystem"
        uix:
          class: header-left
      - type: markdown
        content: "# Basement"
        uix:
          class: middle-left
      - type: area
        area: 65c1e8c8ce7046b49fd30a25bb1d1d79
        show_camera: true
        uix:
          class: middle-left
      - type: markdown
        content: "# Living Room"
        uix:
          class: middle-left
      - type: area
        area: living_room
        show_camera: true
        uix:
          class: middle-left
      - type: markdown
        content: "# &nbsp;"
        uix:
          class: footer-left

  - type: vertical-stack
    cards:
      - type: markdown
        content: "# &nbsp;"
        uix:
          class: header-open
      - type: history-graph
        title: 'Presence History'
        entities:
          - sensor.household
          - input_select.julias_status
          - input_select.michaels_status
          - alarm_control_panel.alarm_system
        uix:
          class: middle-right
      - type: markdown
        content: "# Motion & Occupancy"
        uix:
          class: middle-right
      - type: custom:auto-entities
        card:
          type: entities
          # title: Motion & Occupancy
          show_header_toggle: false
          uix:
            class: middle-right
        filter:
          include:
            - label: motion
            - label: occupancy
      - type: markdown
        content: "# Door Sensors"
        uix:
          class: middle-right
      - type: custom:auto-entities
        card:
          type: entities
          # title: Door Sensors
          show_header_toggle: false
          uix:
            class: middle-right
        filter:
          include:
            - label: interior-door
            - label: exterior-door
