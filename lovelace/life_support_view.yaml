title: Life Support Subsystem
icon: mdi:pulse
path: life-support
cards:
  - type: vertical-stack
    cards:
      - type: button
        name: 'Radon'
        show_name: true
        show_icon: true
        show_state: true
        tap_action:
          action: more-info
        entity: sensor.basement_radon_pcil
        uix:
          class: button-lozenge-right
          style: |
            ha-card {
              {% if states('sensor.basement_radon_pcil') | float < 2.7 -%}
              background: var(--success-color, var(--ha-card-background, var(--card-background-color, white))) !important;
              {%- elif states('sensor.basement_radon_pcil') | float < 4 -%}
              background: var(--warning-color, var(--ha-card-background, var(--card-background-color, white))) !important;
              {%- else -%}
              background: var(--error-color, var(--ha-card-background, var(--card-background-color, white))) !important;
              {%- endif %}
            }
      - type: markdown
        content: "# Life Support"
        uix:
          class: header-right

      - type: thermostat
        entity: climate.dining_room
        uix:
          class: middle-right

      - type: statistics-graph
        title: 'Temperature'
        chart_type: line
        days_to_show: 1
        stat_types:
          - mean
        period: hour
        entities:
          - entity: sensor.wood_valley_haslett_sensors_temperature
            name: Outside
          - entity: sensor.master_bedroom_dresser_motion_sensor_air_temperature
            name: Upstairs
          - entity: sensor.mean_main_floor_temperature
            name: Main Floor
          - entity: sensor.mean_basement_temperature
            name: Basement
        uix:
          class: middle-right

      - type: statistics-graph
        title: 'Humidity'
        chart_type: line
        days_to_show: 1
        stat_types:
          - mean
        period: hour
        entities:
          - entity: sensor.wood_valley_haslett_sensors_humidity
            name: Outside
          - entity: sensor.master_bedroom_dresser_motion_sensor_humidity
            name: Upstairs
          - entity: sensor.mean_main_floor_humidity
            name: Main Floor
          - entity: sensor.mean_basement_humidity
            name: Basement
        uix:
          class: middle-right

      - type: thermostat
        entity: climate.cat_houses
        uix:
          class: middle-right

      - type: markdown
        content: "# &nbsp;"
        uix:
          class: footer-right

  - type: vertical-stack
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "# Workroom Closet"
            uix:
              class: header-left
          - type: custom:mini-graph-card
            name: HUMIDITY
            entities:
              - entity: sensor.wirelesstag_workroom_closet_humidity
                name: HUMIDITY
                color: blue
            show:
              legend: false
              labels: true
            uix:
              class: middle-left
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: TEMPERATURE
                entities:
                  - entity: sensor.wirelesstag_workroom_closet_temperature
                    name: TEMPERATURE
                    color: red
                show:
                  graph: bar
                  legend: false
                uix:
                  class: middle-left
              - type: sensor
                name: BATTERY
                entity: sensor.wirelesstag_workroom_closet_battery_level
                graph: none
                uix:
                  class: middle-blank
          - type: markdown
            content: "# &nbsp;"
            uix:
              class: footer-left

      - type: vertical-stack
        cards:
          - type: markdown
            content: "# Humidor"
            uix:
              class: header-left
          - type: custom:mini-graph-card
            name: HUMIDITY
            entities:
              - entity: sensor.wirelesstag_humidor_humidity
                name: HUMIDITY
                color: blue
            show:
              legend: false
              labels: true
            uix:
              class: middle-left
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: TEMPERATURE
                entities:
                  - entity: sensor.wirelesstag_humidor_temperature
                    name: TEMPERATURE
                    color: red
                show:
                  graph: bar
                  legend: false
                uix:
                  class: middle-left
              - type: sensor
                name: BATTERY
                entity: sensor.wirelesstag_humidor_battery_level
                graph: none
                uix:
                  class: middle-blank
          - type: markdown
            content: "# &nbsp;"
            uix:
              class: footer-left

      - type: vertical-stack
        cards:
          - type: markdown
            content: "# Wine Rack"
            uix:
              class: header-left
          - type: custom:mini-graph-card
            name: HUMIDITY
            entities:
              - entity: sensor.wirelesstag_wine_rack_humidity
                name: HUMIDITY
                color: blue
            show:
              legend: false
              labels: true
            uix:
              class: middle-left
          - type: horizontal-stack
            cards:
              - type: custom:mini-graph-card
                name: TEMPERATURE
                entities:
                  - entity: sensor.wirelesstag_wine_rack_temperature
                    name: TEMPERATURE
                    color: red
                show:
                  graph: bar
                  legend: false
                uix:
                  class: middle-left
              - type: sensor
                name: BATTERY
                entity: sensor.wirelesstag_wine_rack_battery_level
                graph: none
                uix:
                  class: middle-blank
          - type: markdown
            content: "# &nbsp;"
            uix:
              class: footer-left
