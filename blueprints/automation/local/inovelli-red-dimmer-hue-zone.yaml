blueprint:
  name: Inovelli Red Dimmer ↔ Philips Hue Zone Sync
  description: >
    Bidirectional sync between an Inovelli Red Series 2-1 Z-Wave dimmer (VZW31-SN,
    in Smart Bulb Mode with the relay decoupled from any real load) and a
    Philips Hue zone (or group). Changes from the physical switch, Hue app,
    Home Assistant UI, or HomeKit are all reflected on both the switch LED bar
    and the Hue zone.

    **Requirements**
      - Z-Wave JS integration (with the Inovelli Red dimmer paired, Smart Bulb
        Mode enabled)
      - Philips Hue integration
      - The Inovelli switch must expose a `light` entity **and** fire
        `zwave_js_value_notification` events for scene/button presses.

    **How it works**
      1. Single tap / hold on either paddle behaves like a standard dimmer
         (see below) -- this part isn't configurable, it's the whole point
         of the blueprint.
      2. Double/triple/4x/5x taps on either paddle, and all presses on the
         config button (if your switch has one), do nothing by default --
         wire up whatever you want via the advanced action inputs below.
      3. Physical paddle tap / double-tap → sets the Hue zone AND the switch's
         own light entity to the same target brightness (both commanded
         directly, so there's no ambiguity about the resulting level).
      4. Physical paddle hold → only the Hue zone is commanded by this
         blueprint, throttled to roughly 1 update/second with a matching
         `transition` so the bulb interpolates smoothly instead of jumping
         (a Hue Zigbee group can't reliably absorb much more than ~1
         command/second -- pushing more just makes it look jerky). The
         switch's own LED bar is left alone during a hold: Smart Bulb Mode
         switches still ramp their internal level/LED locally in firmware
         the instant the paddle is touched, independent of HA, so nothing
         needs to be sent to keep it moving. See "Ramp rate alignment" below
         for keeping that native ramp's pace roughly matched to this
         blueprint's Hue-side pace.
      5. Any external change to the Hue zone (Hue app, HA UI, HomeKit) →
         after a short settle delay, reads the zone's actual resulting state
         and commands the switch's own light entity to match. This is what
         makes the switch's LED reflect changes it didn't cause itself.

    **No Z-Wave config parameters are written by this blueprint.** LED bar
      position is driven entirely by setting the switch's own `light` entity
      state (a normal Multilevel Switch Set, the same mechanism any dimmer
      uses for its current level) -- not by poking LED color/intensity
      parameters, which are a separate cosmetic feature and not the right
      tool for real-time level tracking.

    **Ramp rate alignment**
      Because taps/holds are handled differently (see above), only the
      *hold* case needs alignment: if you want the switch's own local LED
      ramp (paddle held) to visually finish around the same time as the
      actual Hue zone (which this blueprint paces via `hold_step`), set the
      switch's local continuous dimming speed parameters (VZW31-SN
      parameters 2 = up, 6 = down) so a full 0-99 sweep takes about
      `100 / hold_step` seconds -- e.g. the default `hold_step: 10` implies
      a ~10 second full sweep. These are 100ms-resolution values from 1-100
      (so "10 second full sweep" ≈ value 100), then 1-second resolution from
      101-160 for longer sweeps. Verify the exact scale for your firmware
      version in the parameter's tooltip in Z-Wave JS before setting it --
      this isn't something the blueprint can set for you.

  domain: automation
  author: Claude / Anthropic
  homeassistant:
    min_version: "2024.1.0"

  input:
    inovelli_switch:
      name: Inovelli Red Dimmer (switch entity)
      description: >
        The `light` entity for the Inovelli Red dimmer. Commanded directly
        to move its own LED bar/level after taps and external Hue changes.
      selector:
        entity:
          domain: light
          integration: zwave_js

    inovelli_node_id:
      name: Inovelli Z-Wave Node ID
      description: >
        The Z-Wave node ID of the Inovelli dimmer (visible in Z-Wave JS
        developer tools). Used to filter the button-press events.
      selector:
        number:
          min: 1
          max: 232
          mode: box

    is_key_up_scene_two:
      name: Up/down paddles reversed?
      description: >
        The physical top/bottom paddle doesn't always map to Central Scene
        button "001"/"002" the same way on every device. Try it with the
        default first: if pressing the top (up) paddle behaves like off/dim
        and the bottom (down) paddle behaves like on/brighten, toggle this
        off to swap them.
      default: true
      selector:
        boolean:

    hue_zone:
      name: Philips Hue Zone / Group
      description: >
        The `light` entity representing the Hue zone or group to control.
      selector:
        entity:
          domain: light
          integration: hue

    transition_time:
      name: Transition time (seconds)
      description: Fade duration sent on discrete tap/double-tap commands.
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: s
          mode: slider

    hold_step:
      name: Hold brightness step (%)
      description: >
        How much to increase / decrease the Hue zone's brightness per
        update while the paddle is held. Updates fire roughly once per
        second (Hue Zigbee groups can't reliably keep up with much more
        than that), so this also determines how long a full 0-100% sweep
        takes -- e.g. the default 10% implies ~10 seconds end to end. See
        "Ramp rate alignment" in the blueprint description if you want the
        switch's own local LED ramp to match that pace.
      default: 10
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: "%"
          mode: slider

    # -------------------------------------------------------------------
    # Advanced button actions -- single tap and hold are the built-in
    # dimmer behavior above and aren't configurable here. Everything below
    # does nothing unless you wire it up. All default to no action.
    # -------------------------------------------------------------------
    key_up_2x:
      name: Up paddle double-tap
      description: Action to run when the up paddle is pressed twice.
      default: []
      selector:
        action: {}

    key_up_3x:
      name: Up paddle triple-tap
      description: Action to run when the up paddle is pressed three times.
      default: []
      selector:
        action: {}

    key_up_4x:
      name: Up paddle 4x-tap
      description: Action to run when the up paddle is pressed four times.
      default: []
      selector:
        action: {}

    key_up_5x:
      name: Up paddle 5x-tap
      description: Action to run when the up paddle is pressed five times.
      default: []
      selector:
        action: {}

    key_down_2x:
      name: Down paddle double-tap
      description: Action to run when the down paddle is pressed twice.
      default: []
      selector:
        action: {}

    key_down_3x:
      name: Down paddle triple-tap
      description: Action to run when the down paddle is pressed three times.
      default: []
      selector:
        action: {}

    key_down_4x:
      name: Down paddle 4x-tap
      description: Action to run when the down paddle is pressed four times.
      default: []
      selector:
        action: {}

    key_down_5x:
      name: Down paddle 5x-tap
      description: Action to run when the down paddle is pressed five times.
      default: []
      selector:
        action: {}

    key_config:
      name: Config button press
      description: >
        Action to run when the config (middle) button is pressed once, if
        this switch has one.
      default: []
      selector:
        action: {}

    key_config_2x:
      name: Config button double-tap
      default: []
      selector:
        action: {}

    key_config_3x:
      name: Config button triple-tap
      default: []
      selector:
        action: {}

    key_config_4x:
      name: Config button 4x-tap
      default: []
      selector:
        action: {}

    key_config_5x:
      name: Config button 5x-tap
      default: []
      selector:
        action: {}

    key_config_held:
      name: Config button held
      default: []
      selector:
        action: {}

# ---------------------------------------------------------------------------
# Mode: queued (not restart) -- the switch's own state changes (from taps,
# and from syncing after external Hue changes) also match the hue_changed
# trigger below. Under `restart`, that self-triggered run would cancel an
# in-progress hold loop every time it updates the Hue zone, breaking
# continuous dimming. Queued lets those redundant runs wait their turn
# instead of interrupting the active hold.
# ---------------------------------------------------------------------------
mode: queued
max: 10

# ---------------------------------------------------------------------------
# Variables – resolved once at trigger time
# ---------------------------------------------------------------------------
variables:
  inovelli_switch: !input inovelli_switch
  inovelli_node_id: !input inovelli_node_id
  hue_zone: !input hue_zone
  transition_time: !input transition_time
  hold_step: !input hold_step

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
trigger:
  # ── Physical paddle events (Z-Wave JS scene notifications) ──────────────
  # One generic trigger for all button presses -- which physical paddle and
  # press-type it represents is resolved at runtime in the action below, so
  # the up/down mapping can be toggled per-device via a single input instead
  # of needing separate blueprint inputs per orientation.
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: !input inovelli_node_id
      command_class_name: Central Scene
    id: paddle_event

  # ── External changes to the Hue zone ────────────────────────────────────
  # No to/from filter: a plain state trigger also fires on attribute-only
  # changes (e.g. brightness slid in the Hue app while the light stays
  # "on"), which is required for the switch to track real brightness.
  - platform: state
    entity_id: !input hue_zone
    id: hue_changed

# ---------------------------------------------------------------------------
# Actions
# ---------------------------------------------------------------------------
action:
  - variables:
      is_key_up_scene_two: !input is_key_up_scene_two
      key_up_scene_id: "{{ (1, 2)[is_key_up_scene_two] | int }}"
      key_down_scene_id: "{{ (2, 1)[is_key_up_scene_two] | int }}"
      # The config/scene button is always reported as scene 3 -- unlike
      # up/down, its number isn't affected by the orientation toggle.
      key_config_scene_id: 3
      scene_id: >
        {{ (trigger.event.data.property_key_name | int)
           if trigger.id == 'paddle_event' else none }}
      key_pressed: >
        {{ trigger.event.data.value if trigger.id == 'paddle_event' else none }}
      # A full 0-100% sweep takes 100/hold_step iterations -- holding
      # longer than that does nothing (brightness is already clamped at
      # min/max), so that's the natural point to cap the hold loop's
      # safety net, not an arbitrary worst-case guess. +2 as slack for
      # rounding at the ends of the range.
      max_hold_iterations: "{{ ((100 / hold_step) | round(0, 'ceil') | int) + 2 }}"

  - choose:

      # ────────────────────────────────────────────────────────────────────
      # UPPER TAP → turn Hue zone on (last brightness), then match the switch
      # ────────────────────────────────────────────────────────────────────
      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_up_scene_id
             and key_pressed == 'KeyPressed' }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input hue_zone
            data:
              transition: !input transition_time
          # "Last brightness" is resolved by Hue, not chosen by us -- wait
          # briefly then read back the actual result before matching it.
          - delay:
              milliseconds: 400
          - choose:
              - conditions: "{{ is_state(hue_zone, 'on') }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input inovelli_switch
                    data:
                      brightness: "{{ state_attr(hue_zone, 'brightness') | default(255) | int }}"
                      transition: !input transition_time
            default:
              - service: light.turn_off
                target:
                  entity_id: !input inovelli_switch
                data:
                  transition: !input transition_time

      # ────────────────────────────────────────────────────────────────────
      # UPPER HOLD → brighten the Hue zone in a throttled loop until
      # released. The switch's own LED is not touched here -- see the
      # blueprint description's "Ramp rate alignment" section.
      # ────────────────────────────────────────────────────────────────────
      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_up_scene_id
             and key_pressed == 'KeyHeldDown' }}
        sequence:
          # Central Scene devices typically resend KeyHeldDown every ~200ms
          # for as long as the paddle stays physically held, which also
          # re-matches the top-level trigger above and queues a redundant
          # run for each resend (mode: queued doesn't interrupt the active
          # loop, but a queued duplicate would eventually start its OWN
          # loop with no real release left to catch it, dimming forever).
          # `current` on the automation entity counts this run itself, so
          # >1 here means a loop for this switch is already in flight --
          # bail out instead of starting a second, orphaned one.
          - condition: template
            value_template: "{{ state_attr(this.entity_id, 'current') | int(1) <= 1 }}"
          - repeat:
              while:
                - condition: template
                  # repeat.index caps this at max_hold_iterations (a full
                  # 0-100% sweep, plus slack) so the loop is guaranteed to
                  # end on its own even if release-detection somehow never
                  # fires -- getting stuck here wedges the whole automation
                  # (mode: queued means nothing else runs until this does).
                  value_template: >
                    {{ states(inovelli_switch) != 'unavailable' and repeat.index <= max_hold_iterations }}
              sequence:
                - variables:
                    current_bri: >
                      {{ state_attr(hue_zone, 'brightness') | default(0) | int }}
                    new_bri: >
                      {{ [current_bri + (hold_step / 100 * 255) | int, 255] | min }}
                - service: light.turn_on
                  target:
                    entity_id: !input hue_zone
                  data:
                    brightness: "{{ new_bri }}"
                    transition: 1
                - wait_for_trigger:
                    - platform: event
                      event_type: zwave_js_value_notification
                      event_data:
                        node_id: !input inovelli_node_id
                        command_class_name: Central Scene
                        value: KeyReleased
                  timeout:
                    milliseconds: 1000
                  continue_on_timeout: true
                - condition: template
                  # A bare `condition:` step that evaluates false stops the
                  # whole automation run -- that's the "break" here. We rely
                  # on the `current <= 1` guard above for mutual exclusion
                  # (only one hold-loop, up or down, can be active at once)
                  # rather than matching property_key_name on the release --
                  # some devices don't report it consistently on release,
                  # which would make that comparison never true and hang
                  # the loop forever instead of breaking.
                  value_template: "{{ wait.trigger is none }}"
              # break out of loop when a KeyReleased fires (or the safety cap trips)

      # ────────────────────────────────────────────────────────────────────
      # UPPER PADDLE -- advanced presses (user-defined, no built-in action)
      # ────────────────────────────────────────────────────────────────────
      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_up_scene_id
             and key_pressed == 'KeyPressed2x' }}
        sequence: !input key_up_2x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_up_scene_id
             and key_pressed == 'KeyPressed3x' }}
        sequence: !input key_up_3x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_up_scene_id
             and key_pressed == 'KeyPressed4x' }}
        sequence: !input key_up_4x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_up_scene_id
             and key_pressed == 'KeyPressed5x' }}
        sequence: !input key_up_5x

      # ────────────────────────────────────────────────────────────────────
      # LOWER TAP → turn off both, in parallel
      # ────────────────────────────────────────────────────────────────────
      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_down_scene_id
             and key_pressed == 'KeyPressed' }}
        sequence:
          - parallel:
              - service: light.turn_off
                target:
                  entity_id: !input hue_zone
                data:
                  transition: !input transition_time
              - service: light.turn_off
                target:
                  entity_id: !input inovelli_switch
                data:
                  transition: !input transition_time

      # ────────────────────────────────────────────────────────────────────
      # LOWER HOLD → dim the Hue zone in a throttled loop until released
      # ────────────────────────────────────────────────────────────────────
      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_down_scene_id
             and key_pressed == 'KeyHeldDown' }}
        sequence:
          # See the matching guard on the UPPER HOLD branch above.
          - condition: template
            value_template: "{{ state_attr(this.entity_id, 'current') | int(1) <= 1 }}"
          - repeat:
              while:
                - condition: template
                  # See the matching cap on the UPPER HOLD branch above.
                  value_template: >
                    {{ states(inovelli_switch) != 'unavailable' and repeat.index <= max_hold_iterations }}
              sequence:
                - variables:
                    current_bri: >
                      {{ state_attr(hue_zone, 'brightness') | default(255) | int }}
                    new_bri: >
                      {{ [current_bri - (hold_step / 100 * 255) | int, 1] | max }}
                - service: light.turn_on
                  target:
                    entity_id: !input hue_zone
                  data:
                    brightness: "{{ new_bri }}"
                    transition: 1
                - wait_for_trigger:
                    - platform: event
                      event_type: zwave_js_value_notification
                      event_data:
                        node_id: !input inovelli_node_id
                        command_class_name: Central Scene
                        value: KeyReleased
                  timeout:
                    milliseconds: 1000
                  continue_on_timeout: true
                - condition: template
                  # See the matching comment on the UPPER HOLD branch above:
                  # relies on the `current <= 1` guard for mutual exclusion
                  # instead of matching property_key_name on the release.
                  value_template: "{{ wait.trigger is none }}"

      # ────────────────────────────────────────────────────────────────────
      # LOWER PADDLE -- advanced presses (user-defined, no built-in action)
      # ────────────────────────────────────────────────────────────────────
      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_down_scene_id
             and key_pressed == 'KeyPressed2x' }}
        sequence: !input key_down_2x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_down_scene_id
             and key_pressed == 'KeyPressed3x' }}
        sequence: !input key_down_3x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_down_scene_id
             and key_pressed == 'KeyPressed4x' }}
        sequence: !input key_down_4x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_down_scene_id
             and key_pressed == 'KeyPressed5x' }}
        sequence: !input key_down_5x

      # ────────────────────────────────────────────────────────────────────
      # CONFIG BUTTON -- always scene 3, unaffected by the up/down toggle.
      # Entirely user-defined, no built-in action for any press type.
      # ────────────────────────────────────────────────────────────────────
      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_config_scene_id
             and key_pressed == 'KeyPressed' }}
        sequence: !input key_config

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_config_scene_id
             and key_pressed == 'KeyPressed2x' }}
        sequence: !input key_config_2x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_config_scene_id
             and key_pressed == 'KeyPressed3x' }}
        sequence: !input key_config_3x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_config_scene_id
             and key_pressed == 'KeyPressed4x' }}
        sequence: !input key_config_4x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_config_scene_id
             and key_pressed == 'KeyPressed5x' }}
        sequence: !input key_config_5x

      - conditions: >
          {{ trigger.id == 'paddle_event' and scene_id == key_config_scene_id
             and key_pressed == 'KeyHeldDown' }}
        sequence: !input key_config_held

      # ────────────────────────────────────────────────────────────────────
      # HUE ZONE CHANGED (external – Hue app / HA UI / HomeKit) → match
      # the switch's own light entity to whatever the zone ended up at.
      # ────────────────────────────────────────────────────────────────────
      - conditions: "{{ trigger.id == 'hue_changed' }}"
        sequence:
          # Small delay to let Hue state fully settle
          - delay:
              milliseconds: 500
          - choose:
              - conditions: "{{ is_state(hue_zone, 'on') }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input inovelli_switch
                    data:
                      brightness: "{{ state_attr(hue_zone, 'brightness') | default(255) | int }}"
                      transition: 1
            default:
              - service: light.turn_off
                target:
                  entity_id: !input inovelli_switch
                data:
                  transition: 1
