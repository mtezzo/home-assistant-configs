blueprint:
  name: Inovelli Red Dimmer ↔ Philips Hue Zone Sync
  description: >
    Bidirectional sync between an Inovelli Red Series 2-1 Z-Wave dimmer (VZW31-SN,
    in Smart Bulb Mode with the relay decoupled from any real load) and a
    Philips Hue zone (or group). Changes from the physical switch, Hue app,
    Home Assistant UI, or HomeKit are all reflected on both the switch LED bar
    and the Hue zone.

    **Requirements**
      - Z-Wave JS integration (with the Inovelli Red dimmer paired, Smart Bulb
        Mode enabled)
      - Philips Hue integration
      - The Inovelli switch must expose a `light` entity **and** fire
        `zwave_js_value_notification` events for scene/button presses.

    **How it works**
      1. Physical paddle tap / double-tap → sets the Hue zone AND the switch's
         own light entity to the same target brightness (both commanded
         directly, so there's no ambiguity about the resulting level).
      2. Physical paddle hold → only the Hue zone is commanded by this
         blueprint, throttled to roughly 1 update/second with a matching
         `transition` so the bulb interpolates smoothly instead of jumping
         (a Hue Zigbee group can't reliably absorb much more than ~1
         command/second -- pushing more just makes it look jerky). The
         switch's own LED bar is left alone during a hold: Smart Bulb Mode
         switches still ramp their internal level/LED locally in firmware
         the instant the paddle is touched, independent of HA, so nothing
         needs to be sent to keep it moving. See "Ramp rate alignment" below
         for keeping that native ramp's pace roughly matched to this
         blueprint's Hue-side pace.
      3. Any external change to the Hue zone (Hue app, HA UI, HomeKit) →
         after a short settle delay, reads the zone's actual resulting state
         and commands the switch's own light entity to match. This is what
         makes the switch's LED reflect changes it didn't cause itself.

    **No Z-Wave config parameters are written by this blueprint.** LED bar
      position is driven entirely by setting the switch's own `light` entity
      state (a normal Multilevel Switch Set, the same mechanism any dimmer
      uses for its current level) -- not by poking LED color/intensity
      parameters, which are a separate cosmetic feature and not the right
      tool for real-time level tracking.

    **Ramp rate alignment**
      Because taps/holds are handled differently (see above), only the
      *hold* case needs alignment: if you want the switch's own local LED
      ramp (paddle held) to visually finish around the same time as the
      actual Hue zone (which this blueprint paces via `hold_step`), set the
      switch's local continuous dimming speed parameters (VZW31-SN
      parameters 2 = up, 6 = down) so a full 0-99 sweep takes about
      `100 / hold_step` seconds -- e.g. the default `hold_step: 10` implies
      a ~10 second full sweep. These are 100ms-resolution values from 1-100
      (so "10 second full sweep" ≈ value 100), then 1-second resolution from
      101-160 for longer sweeps. Verify the exact scale for your firmware
      version in the parameter's tooltip in Z-Wave JS before setting it --
      this isn't something the blueprint can set for you.

  domain: automation
  author: Claude / Anthropic
  homeassistant:
    min_version: "2024.1.0"

  input:
    inovelli_switch:
      name: Inovelli Red Dimmer (switch entity)
      description: >
        The `light` entity for the Inovelli Red dimmer. Commanded directly
        to move its own LED bar/level after taps and external Hue changes.
      selector:
        entity:
          domain: light
          integration: zwave_js

    inovelli_node_id:
      name: Inovelli Z-Wave Node ID
      description: >
        The Z-Wave node ID of the Inovelli dimmer (visible in Z-Wave JS
        developer tools). Used to filter the button-press events.
      selector:
        number:
          min: 1
          max: 232
          mode: box

    up_paddle_scene:
      name: "Up" paddle Central Scene button
      description: >
        Which Central Scene button number the physical TOP/up paddle
        actually reports as. This varies by device -- if pressing the top
        paddle turns the light off (and the bottom paddle turns it on),
        swap this to "002" and swap the "down" input below to "001".
      default: "001"
      selector:
        select:
          options:
            - "001"
            - "002"

    down_paddle_scene:
      name: "Down" paddle Central Scene button
      description: >
        Which Central Scene button number the physical BOTTOM/down paddle
        actually reports as. Should always be the opposite of the "up"
        input above.
      default: "002"
      selector:
        select:
          options:
            - "001"
            - "002"

    hue_zone:
      name: Philips Hue Zone / Group
      description: >
        The `light` entity representing the Hue zone or group to control.
      selector:
        entity:
          domain: light
          integration: hue

    transition_time:
      name: Transition time (seconds)
      description: Fade duration sent on discrete tap/double-tap commands.
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          unit_of_measurement: s
          mode: slider

    hold_step:
      name: Hold brightness step (%)
      description: >
        How much to increase / decrease the Hue zone's brightness per
        update while the paddle is held. Updates fire roughly once per
        second (Hue Zigbee groups can't reliably keep up with much more
        than that), so this also determines how long a full 0-100% sweep
        takes -- e.g. the default 10% implies ~10 seconds end to end. See
        "Ramp rate alignment" in the blueprint description if you want the
        switch's own local LED ramp to match that pace.
      default: 10
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: "%"
          mode: slider

# ---------------------------------------------------------------------------
# Mode: queued (not restart) -- the switch's own state changes (from taps,
# and from syncing after external Hue changes) also match the hue_changed
# trigger below. Under `restart`, that self-triggered run would cancel an
# in-progress hold loop every time it updates the Hue zone, breaking
# continuous dimming. Queued lets those redundant runs wait their turn
# instead of interrupting the active hold.
# ---------------------------------------------------------------------------
mode: queued
max: 10

# ---------------------------------------------------------------------------
# Variables – resolved once at trigger time
# ---------------------------------------------------------------------------
variables:
  inovelli_switch: !input inovelli_switch
  inovelli_node_id: !input inovelli_node_id
  hue_zone: !input hue_zone
  transition_time: !input transition_time
  hold_step: !input hold_step

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
trigger:
  # ── Physical paddle events (Z-Wave JS scene notifications) ──────────────

  # Upper paddle tap → turn on
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: !input inovelli_node_id
      command_class_name: Central Scene
      property_key_name: !input up_paddle_scene   # button 1 = upper paddle
      value: KeyPressed
    id: upper_tap

  # Upper paddle double-tap → full brightness
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: !input inovelli_node_id
      command_class_name: Central Scene
      property_key_name: !input up_paddle_scene
      value: KeyPressed2x
    id: upper_double

  # Upper paddle hold → start brightening
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: !input inovelli_node_id
      command_class_name: Central Scene
      property_key_name: !input up_paddle_scene
      value: KeyHeldDown
    id: upper_hold

  # Lower paddle tap → turn off
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: !input inovelli_node_id
      command_class_name: Central Scene
      property_key_name: !input down_paddle_scene   # button 2 = lower paddle
      value: KeyPressed
    id: lower_tap

  # Lower paddle double-tap → minimum brightness (1 %)
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: !input inovelli_node_id
      command_class_name: Central Scene
      property_key_name: !input down_paddle_scene
      value: KeyPressed2x
    id: lower_double

  # Lower paddle hold → start dimming
  - platform: event
    event_type: zwave_js_value_notification
    event_data:
      node_id: !input inovelli_node_id
      command_class_name: Central Scene
      property_key_name: !input down_paddle_scene
      value: KeyHeldDown
    id: lower_hold

  # ── External changes to the Hue zone ────────────────────────────────────
  # No to/from filter: a plain state trigger also fires on attribute-only
  # changes (e.g. brightness slid in the Hue app while the light stays
  # "on"), which is required for the switch to track real brightness.
  - platform: state
    entity_id: !input hue_zone
    id: hue_changed

# ---------------------------------------------------------------------------
# Actions
# ---------------------------------------------------------------------------
action:
  - choose:

      # ────────────────────────────────────────────────────────────────────
      # UPPER TAP → turn Hue zone on (last brightness), then match the switch
      # ────────────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: upper_tap
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input hue_zone
            data:
              transition: !input transition_time
          # "Last brightness" is resolved by Hue, not chosen by us -- wait
          # briefly then read back the actual result before matching it.
          - delay:
              milliseconds: 400
          - choose:
              - conditions: "{{ is_state(hue_zone, 'on') }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input inovelli_switch
                    data:
                      brightness: "{{ state_attr(hue_zone, 'brightness') | default(255) | int }}"
                      transition: !input transition_time
            default:
              - service: light.turn_off
                target:
                  entity_id: !input inovelli_switch
                data:
                  transition: !input transition_time

      # ────────────────────────────────────────────────────────────────────
      # UPPER DOUBLE-TAP → full brightness on both, in parallel
      # ────────────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: upper_double
        sequence:
          - parallel:
              - service: light.turn_on
                target:
                  entity_id: !input hue_zone
                data:
                  brightness_pct: 100
                  transition: !input transition_time
              - service: light.turn_on
                target:
                  entity_id: !input inovelli_switch
                data:
                  brightness_pct: 100
                  transition: !input transition_time

      # ────────────────────────────────────────────────────────────────────
      # UPPER HOLD → brighten the Hue zone in a throttled loop until
      # released. The switch's own LED is not touched here -- see the
      # blueprint description's "Ramp rate alignment" section.
      # ────────────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: upper_hold
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >
                    {{ states(inovelli_switch) != 'unavailable' }}
              sequence:
                - variables:
                    current_bri: >
                      {{ state_attr(hue_zone, 'brightness') | default(0) | int }}
                    new_bri: >
                      {{ [current_bri + (hold_step / 100 * 255) | int, 255] | min }}
                - service: light.turn_on
                  target:
                    entity_id: !input hue_zone
                  data:
                    brightness: "{{ new_bri }}"
                    transition: 1
                - wait_for_trigger:
                    - platform: event
                      event_type: zwave_js_value_notification
                      event_data:
                        node_id: !input inovelli_node_id
                        command_class_name: Central Scene
                        property_key_name: !input up_paddle_scene
                        value: KeyReleased
                  timeout:
                    milliseconds: 1000
                  continue_on_timeout: true
                - condition: template
                  # A bare `condition:` step that evaluates false stops the
                  # whole automation run -- that's the "break" here. We want
                  # to break when a release WAS seen, and keep looping on a
                  # timeout (still held), so this must be true on timeout.
                  value_template: "{{ wait.trigger is none }}"
              # break out of loop when KeyReleased fires

      # ────────────────────────────────────────────────────────────────────
      # LOWER TAP → turn off both, in parallel
      # ────────────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: lower_tap
        sequence:
          - parallel:
              - service: light.turn_off
                target:
                  entity_id: !input hue_zone
                data:
                  transition: !input transition_time
              - service: light.turn_off
                target:
                  entity_id: !input inovelli_switch
                data:
                  transition: !input transition_time

      # ────────────────────────────────────────────────────────────────────
      # LOWER DOUBLE-TAP → minimum brightness (1 %) on both, in parallel
      # ────────────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: lower_double
        sequence:
          - parallel:
              - service: light.turn_on
                target:
                  entity_id: !input hue_zone
                data:
                  brightness_pct: 1
                  transition: !input transition_time
              - service: light.turn_on
                target:
                  entity_id: !input inovelli_switch
                data:
                  brightness_pct: 1
                  transition: !input transition_time

      # ────────────────────────────────────────────────────────────────────
      # LOWER HOLD → dim the Hue zone in a throttled loop until released
      # ────────────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: lower_hold
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >
                    {{ states(inovelli_switch) != 'unavailable' }}
              sequence:
                - variables:
                    current_bri: >
                      {{ state_attr(hue_zone, 'brightness') | default(255) | int }}
                    new_bri: >
                      {{ [current_bri - (hold_step / 100 * 255) | int, 1] | max }}
                - service: light.turn_on
                  target:
                    entity_id: !input hue_zone
                  data:
                    brightness: "{{ new_bri }}"
                    transition: 1
                - wait_for_trigger:
                    - platform: event
                      event_type: zwave_js_value_notification
                      event_data:
                        node_id: !input inovelli_node_id
                        command_class_name: Central Scene
                        property_key_name: !input down_paddle_scene
                        value: KeyReleased
                  timeout:
                    milliseconds: 1000
                  continue_on_timeout: true
                - condition: template
                  # A bare `condition:` step that evaluates false stops the
                  # whole automation run -- that's the "break" here. We want
                  # to break when a release WAS seen, and keep looping on a
                  # timeout (still held), so this must be true on timeout.
                  value_template: "{{ wait.trigger is none }}"

      # ────────────────────────────────────────────────────────────────────
      # HUE ZONE CHANGED (external – Hue app / HA UI / HomeKit) → match
      # the switch's own light entity to whatever the zone ended up at.
      # ────────────────────────────────────────────────────────────────────
      - conditions:
          - condition: trigger
            id: hue_changed
        sequence:
          # Small delay to let Hue state fully settle
          - delay:
              milliseconds: 500
          - choose:
              - conditions: "{{ is_state(hue_zone, 'on') }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input inovelli_switch
                    data:
                      brightness: "{{ state_attr(hue_zone, 'brightness') | default(255) | int }}"
                      transition: 1
            default:
              - service: light.turn_off
                target:
                  entity_id: !input inovelli_switch
                data:
                  transition: 1
