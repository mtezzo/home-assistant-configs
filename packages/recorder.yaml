################################################################
## Packages / Recorder
## https://home-assistant.io/components/recorder/
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: 'recorder'

################################################
## Recorder
################################################

recorder:
  auto_purge: true
  purge_keep_days: 10
  exclude:
      domains:
        - camera
        - media_player
        - sun
        - notify
      entities:
        - automation.person_arriving
        - automation.person_home
        - automation.person_departing
        - automation.person_away
        - automation.person_vacation
        - sensor.date
        - sensor.time
        - sensor.date_time
        - sensor.date_time_utc
        - sensor.date_time_iso
        - sensor.time_date
        - sensor.time_utc
        - sensor.lcars_header
