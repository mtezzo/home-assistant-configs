################################################################
## Packages / House Mode
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: 'house_mode'

      expose: &expose
        <<: *customize
        homebridge_hidden: false

    ################################################
    ## Automation
    ################################################

    automation.auto_away:
      <<: *customize
      friendly_name: "Auto Away"
      icon: mdi:robot

    automation.auto_home:
      <<: *customize
      friendly_name: "Auto Home"
      icon: mdi:robot

    automation.guest_mode_disarm:
      <<: *customize
      friendly_name: "Disarm Alarm on Guest Mode"
      icon: mdi:account

    automation.guest_mode_restore:
      <<: *customize
      friendly_name: "Restore Alarm State When Guest Mode Ends"
      icon: mdi:account

    automation.guest_mode_auto_disable:
      <<: *customize
      friendly_name: "Auto-Disable Guest Mode After Return"
      icon: mdi:account-clock

    automation.vacation_occupancy_evening_on:
      <<: *customize
      friendly_name: "Vacation Occupancy Simulation - Evening On"
      icon: mdi:lightbulb-multiple-outline

    automation.vacation_occupancy_night_routine:
      <<: *customize
      friendly_name: "Vacation Occupancy Simulation - Night Routine"
      icon: mdi:bed-clock

    ################################################
    ## Input Boolean
    ################################################

    input_boolean.guest_mode:
      <<: *customize
      friendly_name: "Guest Mode"
      icon: mdi:account

    ################################################
    ## Script
    ################################################

    script.all_interior_lights_off:
      <<: *customize
      friendly_name: Turn All Interior Lights Off

    script.overhead_lights_off:
      <<: *customize
      friendly_name: Turn Off Overhead Lights (Keep Accent Lighting)

    script.tvs_off:
      <<: *customize
      friendly_name: Turn TVs Off

    script.speakers_off:
      <<: *customize
      friendly_name: Turn Speakers Off

    script.streamers_off:
      <<: *customize
      friendly_name: Turn Streaming Boxes Off

    script.all_media_off:
      <<: *customize
      friendly_name: Turn All Media Off

################################################
## Input Boolean
################################################

input_boolean:
  guest_mode:

################################################
## Automation
################################################

automation housemode:
  - alias: auto_away
    mode: parallel
    trigger:
      - platform: state
        entity_id: sensor.household
        to: 'Away'
      - platform: state
        entity_id: sensor.household
        to: 'Vacation'
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: alarm_control_panel.alarm_system
          state: 'armed_home'
        - condition: state
          entity_id: input_boolean.guest_mode
          state: 'off'
    action:
      - service: alarm_control_panel.alarm_arm_away
        entity_id: alarm_control_panel.alarm_system
        data:
          code: !secret alarm_code
      - service: script.all_interior_lights_off
      - service: script.all_media_off
      - service: script.set_ecobee_away
      - service: switch.turn_off
        entity_id: switch.mnemosyne_surveillance_station_home_mode

  - alias: auto_home
    mode: parallel
    trigger:
      - platform: state
        entity_id: sensor.household
        to: 'Arriving'
    condition:
      condition: and
      conditions:
        - condition: template
          value_template: "{{ trigger.from_state.state == 'Away' or trigger.from_state.state == 'Vacation' }}"
        - condition: template
          value_template: "{{ not is_state('alarm_control_panel.alarm_system', 'armed_home') and not is_state('alarm_control_panel.alarm_system', 'disarmed') }}"
    action:
      - service: alarm_control_panel.alarm_arm_home
        entity_id: alarm_control_panel.alarm_system
        data:
          code: !secret alarm_code
      - service: script.set_ecobee_home
      - service: switch.turn_on
        entity_id: switch.mnemosyne_surveillance_station_home_mode

  - alias: guest_mode_disarm
    trigger:
      - platform: state
        entity_id: input_boolean.guest_mode
        to: 'on'
    action:
      - service: alarm_control_panel.alarm_disarm
        entity_id: alarm_control_panel.alarm_system
        data:
          code: !secret alarm_code

  - alias: guest_mode_restore
    trigger:
      - platform: state
        entity_id: input_boolean.guest_mode
        to: 'off'
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: sensor.household
                state:
                  - 'Home'
                  - 'Arriving'
            sequence:
              - service: alarm_control_panel.alarm_arm_home
                entity_id: alarm_control_panel.alarm_system
                data:
                  code: !secret alarm_code
          - conditions:
              - condition: state
                entity_id: sensor.household
                state:
                  - 'Away'
                  - 'Departing'
                  - 'Vacation'
            sequence:
              - service: alarm_control_panel.alarm_arm_away
                entity_id: alarm_control_panel.alarm_system
                data:
                  code: !secret alarm_code

  - alias: guest_mode_auto_disable
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.guest_mode
        to: 'on'
    action:
      # Guest mode typically gets turned on while still home (so it's not
      # forgotten before leaving), so only start the "are we back" countdown
      # once the house has actually been left empty at least once -- otherwise
      # this would disable guest mode minutes after enabling it, before ever
      # leaving.
      - wait_for_trigger:
          - platform: state
            entity_id: sensor.household
            from: 'Home'
      - wait_for_trigger:
          - platform: state
            entity_id: sensor.household
            to: 'Home'
            for:
              minutes: 10
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'on'
      - service: input_boolean.turn_off
        entity_id: input_boolean.guest_mode

  # Occupancy simulation while the house is empty for an extended trip.
  # Skipped entirely if guest_mode is on, since the house is then genuinely
  # occupied (a caretaker) and doesn't need faking. Exterior lights (porch,
  # driveway) are deliberately excluded -- those already run on their own
  # dusk-to-dawn automation regardless of occupancy, so touching them here
  # would add nothing.
  #
  # Every wait below is a wait_for_trigger (not a plain delay) so it can be
  # cut short the instant something relevant changes, rather than sleeping
  # blindly for up to 45+ minutes before noticing. Abort triggers: the
  # household is no longer 'Vacation' (you're home), guest mode gets turned
  # on, or one of the same motion/occupancy/door sensors alarm.yaml already
  # treats as "someone's here" fires. The alarm_control_panel itself is a
  # purely virtual state machine that nobody actually arms/disarms in
  # person -- a cat sitter never touches it -- so it's not usable as a
  # presence signal here; the physical sensors are.
  - alias: vacation_occupancy_evening_on
    trigger:
      - platform: sun
        event: sunset
        offset: '-00:15:00'
    condition:
      - condition: state
        entity_id: sensor.household
        state: 'Vacation'
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'off'
    variables:
      vacation_lights:
        - light.office_bookshelf_lamp
        - light.kitchen_lights
        - light.dining_room_light
        - light.hue_basement_lounge  # glow from the basement windows
    action:
      # Jitter the start so lights don't snap on at the same instant every
      # night.
      - wait_for_trigger: &vacation_abort_triggers
          - platform: state
            entity_id: sensor.household
          - platform: state
            entity_id: input_boolean.guest_mode
            to: 'on'
          # Same 'someone's here' signal as alarm.yaml's
          # trigger_alarm_on_binary_sensor / trigger_alarm_on_exterior_door --
          # reuses the interior-door, exterior-door, motion, and occupancy
          # labels directly, so this stays correct as those labels change
          # (e.g. it now automatically excludes the dead kitchen motion
          # sensor and correctly matches the garage door's real open/closed
          # states, both of which this block got wrong before those labels
          # existed).
          - platform: template
            value_template: >
              {{ (expand(label_entities('interior-door')) + expand(label_entities('exterior-door')) + expand(label_entities('motion')) + expand(label_entities('occupancy'))) | selectattr('state', 'in', ['on', 'open']) | list | count > 0 }}
        timeout: "{{ range(0, 2700) | random }}"  # up to 45 min
        continue_on_timeout: true
      - if:
          # wait_for_trigger + continue_on_timeout leaves `wait.trigger` as
          # none if we simply timed out, or set to the trigger data if
          # something in the list above actually fired -- so this is "did we
          # get interrupted," not a re-derived state check.
          - condition: template
            value_template: &vacation_abort_condition "{{ wait.trigger is not none }}"
        then:
          - stop: &vacation_abort_reason "Someone appears to be home or in the house -- aborting vacation occupancy simulation"
      - repeat:
          for_each: "{{ vacation_lights }}"
          sequence:
            # Not every light every night -- ~65% chance each, so the pattern
            # varies night to night rather than being identical.
            - if:
                - condition: template
                  value_template: "{{ range(0, 100) | random < 65 }}"
              then:
                # Stagger each light rather than flipping them all at once.
                - wait_for_trigger: *vacation_abort_triggers
                  timeout: "{{ range(0, 600) | random }}"  # up to 10 min
                  continue_on_timeout: true
                - if:
                    - condition: template
                      value_template: *vacation_abort_condition
                  then:
                    - stop: *vacation_abort_reason
                - service: light.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"

  - alias: vacation_occupancy_night_routine
    trigger:
      - platform: time
        at: '22:00:00'
    condition:
      - condition: state
        entity_id: sensor.household
        state: 'Vacation'
      - condition: state
        entity_id: input_boolean.guest_mode
        state: 'off'
    variables:
      vacation_lights:
        - light.office_bookshelf_lamp
        - light.kitchen_lights
        - light.dining_room_light
        - light.hue_basement_lounge
    action:
      # Downstairs/basement lights off sometime between 22:00-22:45.
      - wait_for_trigger: *vacation_abort_triggers
        timeout: "{{ range(0, 2700) | random }}"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: *vacation_abort_condition
        then:
          - stop: *vacation_abort_reason
      - service: light.turn_off
        target:
          entity_id: "{{ vacation_lights }}"
      # Bedroom lamp (via the outlet switch) comes on 15-45 min later --
      # simulating heading upstairs for the night.
      - wait_for_trigger: *vacation_abort_triggers
        timeout: "{{ range(900, 2700) | random }}"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: *vacation_abort_condition
        then:
          - stop: *vacation_abort_reason
      - service: switch.turn_on
        entity_id: switch.master_bedroom_outlet_switch
      # Stays on 30-90 min (reading in bed, etc.) before lights-out.
      - wait_for_trigger: *vacation_abort_triggers
        timeout: "{{ range(1800, 5400) | random }}"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: *vacation_abort_condition
        then:
          - stop: *vacation_abort_reason
      - service: switch.turn_off
        entity_id: switch.master_bedroom_outlet_switch

################################################
## Script
################################################

script:
  # Membership driven by 'interior-light' x 'primary-light'/'accent-light'
  # label intersections. Two variants because the desired scope differs by
  # who's calling:
  #   - all_interior_lights_off is a genuine full sweep (primary + accent) --
  #     used by bedtime (good_night) and leaving the house (auto_away),
  #     where accent/mood lighting like the basement neon sign should also
  #     go off.
  #   - overhead_lights_off only touches 'primary-light' -- used by the
  #     dashboard button for killing overhead lighting *in order to* set a
  #     mood, so accent lighting must be left alone.
  #
  # No exterior equivalent: exterior lighting runs entirely on its own
  # UI-configured timers and isn't meant to be commanded off from here.
  #
  # Both split target by domain rather than using a single
  # homeassistant.turn_off call -- some labeled entities are switch domain
  # (e.g. switch.driveway_lights carries 'exterior-light'/'primary-light'),
  # and `transition` isn't a valid switch.turn_off parameter, so a
  # mixed-domain target with that data would error on any switch entity in
  # the list.
  all_interior_lights_off:
    sequence:
      - variables:
          interior_lights: "{{ label_entities('interior-light') | select('in', label_entities('primary-light') + label_entities('accent-light')) | list }}"
      - service: light.turn_off
        target:
          entity_id: "{{ interior_lights | select('match', '^light\\.') | list }}"
        data:
          transition: 5
      - service: switch.turn_off
        target:
          entity_id: "{{ interior_lights | select('match', '^switch\\.') | list }}"
      - service: switch.turn_off
        entity_id: switch.master_bedroom_outlet_switch
  overhead_lights_off:
    sequence:
      - variables:
          primary_interior: "{{ label_entities('interior-light') | select('in', label_entities('primary-light')) | list }}"
      - service: light.turn_off
        target:
          entity_id: "{{ primary_interior | select('match', '^light\\.') | list }}"
        data:
          transition: 5
      - service: switch.turn_off
        target:
          entity_id: "{{ primary_interior | select('match', '^switch\\.') | list }}"
  # Bulk media control driven by the 'media-tv'/'media-speaker'/
  # 'media-streaming-box' type labels rather than a hardcoded entity list --
  # both because these devices churn constantly (new Apple TVs, new
  # HomePods, new TVs, things moved between rooms and renamed), and because
  # decomposing into per-type sub-scripts means a media_player entity that
  # hasn't been categorized yet is simply never touched by the sweep, rather
  # than turned off just because it exists in the domain.
  #
  # Some devices are represented by both a media_player entity (playback
  # control) and a separate switch entity (hard power cutoff -- a smart plug
  # or an integration-provided power switch, e.g. switch.lg_tv/switch.xbox_one
  # today), so each sub-script splits its label's entities by domain and
  # calls the matching service for each rather than assuming media_player
  # domain throughout. Both entities for a given device need the same type
  # label for this to catch the switch half too.
  tvs_off:
    sequence:
      - variables:
          tv_entities: "{{ label_entities('media-tv') }}"
      - service: media_player.turn_off
        target:
          entity_id: "{{ tv_entities | select('match', '^media_player\\.') | list }}"
      - service: switch.turn_off
        target:
          entity_id: "{{ tv_entities | select('match', '^switch\\.') | list }}"

  # media_player.turn_off is a no-op on HomePods and (per report) Sonos too --
  # both are always-on hardware with no real power state to command via
  # their integrations, so "off" for a speaker actually means pause. Any
  # switch-domain speaker entity (e.g. a smart plug powering an amp) still
  # gets a real turn_off, since that one *does* have a power state.
  speakers_off:
    sequence:
      - variables:
          speaker_entities: "{{ label_entities('media-speaker') }}"
      - service: media_player.media_pause
        target:
          entity_id: "{{ speaker_entities | select('match', '^media_player\\.') | list }}"
      - service: switch.turn_off
        target:
          entity_id: "{{ speaker_entities | select('match', '^switch\\.') | list }}"

  streamers_off:
    sequence:
      - variables:
          streamer_entities: "{{ label_entities('media-streaming-box') }}"
      - service: media_player.turn_off
        target:
          entity_id: "{{ streamer_entities | select('match', '^media_player\\.') | list }}"
      - service: switch.turn_off
        target:
          entity_id: "{{ streamer_entities | select('match', '^switch\\.') | list }}"

  all_media_off:
    sequence:
      - service: script.tvs_off
      - service: script.speakers_off
      - service: script.streamers_off
