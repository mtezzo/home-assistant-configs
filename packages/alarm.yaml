################################################################
## Packages / Alarm
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: 'alarm'

      expose: &expose
        <<: *customize
        homebridge_hidden: false

    ################################################
    ## Alarm Control Panel
    ################################################

    alarm_control_panel.alarm_system:
      <<: *customize
      friendly_name: "Alarm System"

    ################################################
    ## Automation
    ################################################

    automation.persistence_publish_alarm_control_panel:
      <<: *customize
      friendly_name: "Persistence Publish (Alarm System)"
      icon: mdi:alarm

    automation.persistence_subscribe_alarm_control_panel:
      <<: *customize
      friendly_name: "Persistence Subscribe (Alarm System)"
      icon: mdi:alarm

    automation.trigger_alarm_on_binary_sensor:
      <<: *customize
      friendly_name: "Trigger Alarm on Binary Sensor"

    automation.trigger_alarm_on_exterior_door:
      <<: *customize
      friendly_name: "Trigger Alarm on Exterior Door (Away or Night)"

    automation.alarm_triggered_notification:
      <<: *customize
      friendly_name: "Send Notification on Alarm Trigger"
      icon: mdi:message-text

    automation.trigger_notification_on_sensor_tamper:
      <<: *customize
      friendly_name: "Send Notification on Tamper"
      icon: mdi:message-text

    automation.trigger_notification_on_smoke:
      <<: *customize
      friendly_name: "Send Notification on Smoke"
      icon: mdi:alarm-bell

    automation.trigger_notification_on_co:
      <<: *customize
      friendly_name: "Send Notification on Carbon Monoxide"
      icon: mdi:alarm-bell

    automation.trigger_notification_on_water_leak:
      <<: *customize
      friendly_name: "Send Notification on Water Leak"
      icon: mdi:water-alert

    automation.trigger_notification_on_garage_door_open:
      <<: *customize
      friendly_name: "Send Notification on Garage Door Left Open"
      icon: mdi:message-text

################################################
## Alarm Control Panel
################################################

alarm_control_panel:
  - platform: manual
    name: alarm_system
    code: !secret alarm_code
    arming_time: 45
    delay_time: 45
    trigger_time: 120
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 0
      delay_time: 0
    armed_night:
      arming_time: 0
      delay_time: 0
    armed_vacation:
      arming_time: 0
      delay_time: 0

################################################
## Automation
################################################

automation alarm:
  - alias: persistence_publish_alarm_control_panel
    initial_state: 'on'
    trigger:
      - platform: state
        entity_id: alarm_control_panel.alarm_system
    condition:
      - condition: template
        value_template: "{{ trigger.to_state is not none }}"
      - condition: template
        value_template: "{{ trigger.to_state.attributes is not none }}"
      - condition: template
        value_template: "{{ trigger.from_state is not none }}"
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
      - condition: template
        value_template: "{{ trigger.to_state.state != 'pending' }}"
      - condition: template
        value_template: "{{ trigger.to_state.state != 'triggered' }}"
    action:
      - service: mqtt.publish
        data_template:
          topic: "homeassistant/alarm_control_panel/alarm_system"
          payload: "{{ trigger.to_state.state }}"
          retain: true

  - alias: persistence_subscribe_alarm_control_panel
    initial_state: 'on'
    trigger:
      - platform: mqtt
        topic: homeassistant/alarm_control_panel/alarm_system
    condition:
      - condition: template
        value_template: "{{ not is_state('alarm_control_panel.alarm_system', trigger.payload) }}"
    action:
      - service_template: >-
          {% if trigger.payload == 'armed_home' %}
            alarm_control_panel.alarm_arm_home
          {% elif trigger.payload == 'armed_night' %}
            alarm_control_panel.alarm_arm_night
          {% elif trigger.payload == 'disarmed' %}
            alarm_control_panel.alarm_disarm
          {% elif trigger.payload == 'armed_vacation' %}
            alarm_control_panel.alarm_arm_vacation
          {% else %}
            alarm_control_panel.alarm_arm_away
          {% endif %}
        entity_id: alarm_control_panel.alarm_system
        data:
          code: !secret alarm_code

  - alias: trigger_alarm_on_exterior_door
    trigger:
      # Exterior Doors
      - platform: state
        entity_id: cover.garage_door
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.back_door_open #garage side door
        from: 'off'
        to: 'on'
    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: alarm_control_panel.alarm_system
            state: 'armed_away'
          - condition: state
            entity_id: alarm_control_panel.alarm_system
            state: 'armed_night'
    action:
      service: alarm_control_panel.alarm_trigger
      entity_id: alarm_control_panel.alarm_system
      data:
        code: !secret alarm_code

  - alias: trigger_alarm_on_binary_sensor
    trigger:
      # Interior Door Sensors
      - platform: state
        entity_id: binary_sensor.hue_secure_contact_sensor_2_opening #basement stair closet
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.hue_secure_contact_sensor_3_opening #sump pump closet
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.hue_secure_contact_sensor_4_opening #workroom closet
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.laundry_room_door_open #laundry room door
        from: 'off'
        to: 'on'
      # Ecobee Occupancy Sensors
      - platform: state
        entity_id: binary_sensor.dining_room_occupancy
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.family_room_occupancy
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.katherine_s_room_occupancy
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.master_bedroom_occupancy
        from: 'off'
        to: 'on'
      # Motion Sensors
      - platform: state
        entity_id: binary_sensor.family_room_motion_sensor_motion_detection
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.kitchen_motion_sensor_motion_detection
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.master_bedroom_dresser_motion_sensor_motion_detection
        from: 'off'
        to: 'on'
    condition:
      - condition: state
        entity_id: alarm_control_panel.alarm_system
        state: 'armed_away'
    action:
      service: alarm_control_panel.alarm_trigger
      entity_id: alarm_control_panel.alarm_system
      data:
        code: !secret alarm_code

  - alias: alarm_triggered_notification
    trigger:
      - platform: state
        entity_id: alarm_control_panel.alarm_system
        to: 'triggered'
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Alarm Triggered
          message: &alarm_triggered_message >
            Alarm was triggered on:
            {% for state in states.binary_sensor -%}
              {% if state.state == 'on' and state.entity_id in ['cover.garage_door', 'binary_sensor.hue_secure_contact_sensor_2_opening', 'binary_sensor.hue_secure_contact_sensor_3_opening', 'binary_sensor.hue_secure_contact_sensor_4_opening', 'binary_sensor.laundry_room_door_open', 'binary_sensor.back_door_open',
              'binary_sensor.dining_room_occupancy', 'binary_sensor.family_room_occupancy', 'binary_sensor.katherine_s_room_occupancy', 'binary_sensor.master_bedroom_occupancy', 'binary_sensor.family_room_motion_sensor_motion_detection', 'binary_sensor.kitchen_motion_sensor_motion_detection', 'binary_sensor.master_bedroom_dresser_motion_sensor_motion_detection'] %}
                {{ state.name }}
              {%- endif -%}
            {%- endfor -%}
      - service: notify.persistent_notification
        data_template:
          notification_id: alarm_triggered
          title: Alarm Triggered
          message: *alarm_triggered_message

  - alias: trigger_notification_on_sensor_tamper
    trigger:

      - platform: state
        entity_id: binary_sensor.basement_stair_closet_door_tampering_product_cover_removed
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.basement_sump_pump_closet_door_tampering_product_cover_removed
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.workroom_closet_door_tampering_product_cover_removed
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.door_laundry_room_door_tampering_product_cover_removed
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.water_heater_flood_sensor_tampering_product_cover_removed
        from: 'off'
        to: 'on'
      - platform: state
        entity_id: binary_sensor.family_room_motion_sensor_tampering_product_cover_removed
        from: 'off'
        to: 'on'
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Tamper Notification
          message: &tamper_message >
            Cover removed from {{ trigger.to_state.attributes.friendly_name }}!
      - service: notify.persistent_notification
        data_template:
          notification_id: tamper_notification
          title: Tamper Notification
          message: *tamper_message

  - alias: trigger_notification_on_smoke
    trigger:
      - platform: state
        entity_id: binary_sensor.smoke_and_carbon_monoxide_sensor_smoke_detected
        from: 'off'
        to: 'on'
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Smoke Alert
          message: &smoke_message >
            Smoke detected in the house!
      - service: notify.persistent_notification
        data_template:
          notification_id: smoke_alert
          title: Smoke Alert
          message: *smoke_message
      - service: script.sonos_say
        data:
          sonos_entity: media_player.living_room
          volume: 0.6
          delay: 5
          message: Smoke Detected!

  - alias: trigger_notification_on_co
    trigger:
      - platform: state
        entity_id: binary_sensor.smoke_and_carbon_monoxide_sensor_carbon_monoxide_detected
        from: 'off'
        to: 'on'
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Carbon Monoxide Alert
          message: &co_message >
            Carbon monoxide detected in the house!
      - service: notify.persistent_notification
        data_template:
          notification_id: co_alert
          title: Carbon Monoxide Alert
          message: *co_message
      - service: script.sonos_say
        data:
          sonos_entity: media_player.living_room
          volume: 0.6
          delay: 5
          message: Carbon Monoxide Detected!

  - alias: trigger_notification_on_water_leak
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.basement_bathroom_water_sensor_water_leak_detected
          - binary_sensor.floor_water_sensor_water_leak_detected
          - binary_sensor.guest_bathroom_water_sensor_water_leak_detected
          - binary_sensor.laundry_sink_water_sensor_water_leak_detected
          - binary_sensor.main_floor_bathroom_water_sensor_water_leak_detected
          - binary_sensor.master_bathroom_water_sensor_water_leak_detected
          - binary_sensor.sump_pump_water_sensor_water_leak_detected
          - binary_sensor.washing_machine_water_sensor_water_leak_detected
          - binary_sensor.water_heater_flood_sensor_water_leak_detected
        from: 'off'
        to: 'on'
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Water Leak Detected
          message: &water_leak_message >
            Water leak detected at {{ trigger.to_state.attributes.friendly_name }}!
      - service: notify.persistent_notification
        data_template:
          notification_id: water_leak_detected
          title: Water Leak Detected
          message: *water_leak_message

  - alias: trigger_notification_on_garage_door_open
    trigger:
      - platform: state
        entity_id: cover.garage_door
        to: 'on'
        for:
          hours: 1
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Garage Door Open
          message: "The garage door has been open for over an hour."
