################################################################
## Packages / Alarm
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: 'alarm'

      expose: &expose
        <<: *customize
        homebridge_hidden: false

    ################################################
    ## Alarm Control Panel
    ################################################

    alarm_control_panel.alarm_system:
      <<: *customize
      friendly_name: "Alarm System"

    ################################################
    ## Automation
    ################################################

    automation.persistence_publish_alarm_control_panel:
      <<: *customize
      friendly_name: "Persistence Publish (Alarm System)"
      icon: mdi:alarm

    automation.persistence_subscribe_alarm_control_panel:
      <<: *customize
      friendly_name: "Persistence Subscribe (Alarm System)"
      icon: mdi:alarm

    automation.trigger_alarm_on_binary_sensor:
      <<: *customize
      friendly_name: "Trigger Alarm on Binary Sensor"

    automation.trigger_alarm_on_exterior_door:
      <<: *customize
      friendly_name: "Trigger Alarm on Exterior Door (Away or Night)"

    automation.trigger_notification_on_sensor_tamper:
      <<: *customize
      friendly_name: "Send Notification on Tamper"
      icon: mdi:message-text

    automation.trigger_notification_on_smoke:
      <<: *customize
      friendly_name: "Send Notification on Smoke"
      icon: mdi:alarm-bell

    automation.trigger_notification_on_co:
      <<: *customize
      friendly_name: "Send Notification on Carbon Monoxide"
      icon: mdi:alarm-bell

    automation.trigger_notification_on_water_leak:
      <<: *customize
      friendly_name: "Send Notification on Water Leak"
      icon: mdi:water-alert

    automation.trigger_notification_on_garage_door_open:
      <<: *customize
      friendly_name: "Send Notification on Garage Door Left Open"
      icon: mdi:message-text

    automation.life_safety_led_indicator:
      <<: *customize
      friendly_name: "Life Safety LED Indicator"
      icon: mdi:fire-alert

    ################################################
    ## Binary Sensor
    ################################################

    binary_sensor.life_safety_alert_active:
      <<: *customize
      friendly_name: "Life Safety Alert Active"
      icon: mdi:fire-alert

################################################
## Binary Sensor
################################################

template:
  - binary_sensor:
    - default_entity_id: binary_sensor.life_safety_alert_active
      device_class: safety
      state: >
        {{ (expand(label_entities('smoke')) + expand(label_entities('carbon-monoxide'))) | selectattr('state', 'eq', 'on') | list | count > 0 }}

################################################
## Alarm Control Panel
################################################

alarm_control_panel:
  - platform: manual
    name: alarm_system
    code: !secret alarm_code
    arming_time: 45
    delay_time: 45
    trigger_time: 120
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 0
      delay_time: 0
    armed_night:
      arming_time: 0
      delay_time: 0
    armed_vacation:
      arming_time: 0
      delay_time: 0

################################################
## Automation
################################################

automation alarm:
  - alias: persistence_publish_alarm_control_panel
    initial_state: 'on'
    trigger:
      - platform: state
        entity_id: alarm_control_panel.alarm_system
    condition:
      - condition: template
        value_template: "{{ trigger.to_state is not none }}"
      - condition: template
        value_template: "{{ trigger.to_state.attributes is not none }}"
      - condition: template
        value_template: "{{ trigger.from_state is not none }}"
      - condition: template
        value_template: "{{ trigger.from_state.state != trigger.to_state.state }}"
      - condition: template
        value_template: "{{ trigger.to_state.state != 'pending' }}"
      - condition: template
        value_template: "{{ trigger.to_state.state != 'triggered' }}"
    action:
      - service: mqtt.publish
        data_template:
          topic: "homeassistant/alarm_control_panel/alarm_system"
          payload: "{{ trigger.to_state.state }}"
          retain: true

  - alias: persistence_subscribe_alarm_control_panel
    initial_state: 'on'
    trigger:
      - platform: mqtt
        topic: homeassistant/alarm_control_panel/alarm_system
    condition:
      - condition: template
        value_template: "{{ not is_state('alarm_control_panel.alarm_system', trigger.payload) }}"
    action:
      - service_template: >-
          {% if trigger.payload == 'armed_home' %}
            alarm_control_panel.alarm_arm_home
          {% elif trigger.payload == 'armed_night' %}
            alarm_control_panel.alarm_arm_night
          {% elif trigger.payload == 'disarmed' %}
            alarm_control_panel.alarm_disarm
          {% elif trigger.payload == 'armed_vacation' %}
            alarm_control_panel.alarm_arm_vacation
          {% else %}
            alarm_control_panel.alarm_arm_away
          {% endif %}
        entity_id: alarm_control_panel.alarm_system
        data:
          code: !secret alarm_code

  # Rewritten from an aggregate "is anything in this label currently
  # open/on" trigger to a generic state_changed event trigger + label
  # membership condition -- the aggregate version could only tell you the
  # count crossed zero, never *which* entity did it, so the notification
  # (previously a separate alarm_triggered_notification automation, now
  # folded directly into this one and trigger_alarm_on_binary_sensor below)
  # had to list everything currently active across every alarm-relevant
  # label instead of naming the one thing that actually caused it.
  #
  # Mixes domains (cover.garage_door + binary_sensor.back_door_open) on
  # purpose -- they're one logical concept (exterior entry point) feeding
  # the same condition and action -- but that's exactly why the check
  # matches both 'open' (native cover state) and 'on' (binary_sensor),
  # rather than a single value: a naive '== on' check would silently miss
  # the garage door, since covers report open/closed, not on/off.
  #
  # old_state guarding: 'old_state is none' covers an entity's very first
  # state_changed event (e.g. right after HA restart); without that OR
  # clause, old_state.state would error on that first event instead of
  # just treating it as a genuine open/closed transition.
  - alias: trigger_alarm_on_exterior_door
    mode: parallel
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in label_entities('exterior-door')
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state in ['on', 'open']
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state not in ['on', 'open']) }}
      - condition: or
        conditions:
          - condition: state
            entity_id: alarm_control_panel.alarm_system
            state: 'armed_away'
          - condition: state
            entity_id: alarm_control_panel.alarm_system
            state: 'armed_night'
    action:
      - service: alarm_control_panel.alarm_trigger
        entity_id: alarm_control_panel.alarm_system
        data:
          code: !secret alarm_code
      - service: notify.everyone
        data_template:
          data:
            title: Alarm Triggered
          message: &exterior_door_alarm_message >
            Alarm triggered: {{ trigger.event.data.new_state.name }}{{ ' (' + area_name(trigger.event.data.entity_id) + ')' if area_name(trigger.event.data.entity_id) else '' }}
      - service: notify.persistent_notification
        data_template:
          notification_id: alarm_triggered
          title: Alarm Triggered
          message: *exterior_door_alarm_message

  # Same restructuring as trigger_alarm_on_exterior_door above, for interior
  # doors, occupancy, and motion -- all of which only matter while
  # armed_away (exterior doors additionally count while armed_night, which
  # is why that one stayed a separate automation rather than merging here).
  - alias: trigger_alarm_on_binary_sensor
    mode: parallel
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in
               (label_entities('interior-door') + label_entities('occupancy') + label_entities('motion'))
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state == 'on'
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state != 'on') }}
      - condition: state
        entity_id: alarm_control_panel.alarm_system
        state: 'armed_away'
    action:
      - service: alarm_control_panel.alarm_trigger
        entity_id: alarm_control_panel.alarm_system
        data:
          code: !secret alarm_code
      - service: notify.everyone
        data_template:
          data:
            title: Alarm Triggered
          message: &binary_sensor_alarm_message >
            Alarm triggered: {{ trigger.event.data.new_state.name }}{{ ' (' + area_name(trigger.event.data.entity_id) + ')' if area_name(trigger.event.data.entity_id) else '' }}
      - service: notify.persistent_notification
        data_template:
          notification_id: alarm_triggered
          title: Alarm Triggered
          message: *binary_sensor_alarm_message

  # Membership driven by the 'tamper' label rather than a hardcoded list --
  # this automation was silently broken before, since several of these
  # entity_ids were stale (renamed by a Hue migration) and two others
  # referenced sensors that had since been replaced/removed entirely.
  #
  # Same generic state_changed event + label-membership pattern as the alarm
  # triggers above, so the message names the specific entity/area rather
  # than an aggregate list of everything currently tampered.
  - alias: trigger_notification_on_sensor_tamper
    mode: parallel
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in label_entities('tamper')
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state == 'on'
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state != 'on') }}
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Tamper Notification
          message: &tamper_message >
            Cover removed from {{ trigger.event.data.new_state.name }}{{ ' (' + area_name(trigger.event.data.entity_id) + ')' if area_name(trigger.event.data.entity_id) else '' }}!
      - service: notify.persistent_notification
        data_template:
          notification_id: tamper_notification
          title: Tamper Notification
          message: *tamper_message

  # Membership driven by the 'smoke' label rather than a hardcoded entity --
  # only one sensor today, but this covers any future smoke detector (e.g. a
  # second Airthings-reported source) without touching this automation.
  - alias: trigger_notification_on_smoke
    trigger:
      - platform: template
        value_template: >
          {{ expand(label_entities('smoke')) | selectattr('state', 'eq', 'on') | list | count > 0 }}
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Smoke Alert
          message: &smoke_message >
            Smoke detected in the house!
      - service: notify.persistent_notification
        data_template:
          notification_id: smoke_alert
          title: Smoke Alert
          message: *smoke_message
      - service: script.sonos_say
        data:
          sonos_entity: media_player.living_room
          volume: 0.6
          delay: 5
          message: Smoke Detected!

  # Membership driven by the 'carbon-monoxide' label -- only one sensor today
  # (the hardwired smoke/CO network), but this covers Mila or a future
  # Airthings CO source without touching this automation, as long as it's
  # tagged with the label when it shows up.
  - alias: trigger_notification_on_co
    trigger:
      - platform: template
        value_template: >
          {{ expand(label_entities('carbon-monoxide')) | selectattr('state', 'eq', 'on') | list | count > 0 }}
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Carbon Monoxide Alert
          message: &co_message >
            Carbon monoxide detected in the house!
      - service: notify.persistent_notification
        data_template:
          notification_id: co_alert
          title: Carbon Monoxide Alert
          message: *co_message
      - service: script.sonos_say
        data:
          sonos_entity: media_player.living_room
          volume: 0.6
          delay: 5
          message: Carbon Monoxide Detected!

  # Membership driven by the 'water-leak' label (Settings > Entities) rather
  # than a hardcoded entity list -- label any new leak sensor and it's
  # included automatically, survives renames too.
  #
  # Same generic state_changed event + label-membership pattern as the alarm
  # triggers above, so the message names the specific entity/area rather
  # than an aggregate list of everything currently wet.
  - alias: trigger_notification_on_water_leak
    mode: parallel
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in label_entities('water-leak')
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state == 'on'
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state != 'on') }}
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Water Leak Detected
          message: &water_leak_message >
            Water leak detected at {{ trigger.event.data.new_state.name }}{{ ' (' + area_name(trigger.event.data.entity_id) + ')' if area_name(trigger.event.data.entity_id) else '' }}!
      - service: notify.persistent_notification
        data_template:
          notification_id: water_leak_detected
          title: Water Leak Detected
          message: *water_leak_message

  - alias: trigger_notification_on_garage_door_open
    trigger:
      - platform: state
        entity_id: cover.garage_door
        to: 'open'
        for:
          hours: 1
    action:
      - service: notify.everyone
        data_template:
          data:
            title: Garage Door Open
          message: "The garage door has been open for over an hour."

  # Membership driven by the 'life-safety-alert' (which devices should show
  # this) x 'inovelli-led' (which devices actually speak this Z-Wave
  # notification parameter) label intersection. Fast-siren red is
  # deliberately more urgent-looking than radon's slower pulse, so a glance
  # can tell the two apart.
  #
  # binary_sensor.life_safety_alert_active exists specifically so this can be
  # a plain state trigger (fires on both directions) with a choose/default,
  # matching basement_radon_led_alert's structure -- a boolean template
  # trigger only fires on the false->true edge, which isn't enough here since
  # we also need the true->false edge to clear the LEDs.
  - alias: life_safety_led_indicator
    initial_state: true
    trigger:
      - platform: state
        entity_id: binary_sensor.life_safety_alert_active
    variables:
      alert_switches: "{{ label_entities('life-safety-alert') | select('in', label_entities('inovelli-led')) | list | map('device_id') | unique | list }}"
    action:
      - choose:
          - conditions: "{{ trigger.to_state.state == 'on' }}"
            sequence:
              - service: zwave_js.bulk_set_partial_config_parameters
                target:
                  device_id: "{{ alert_switches }}"
                data:
                  parameter: 99
                  value:
                    255: 255        # duration: indefinite, until cleared
                    65280: 100      # level: 100%
                    16711680: 0     # color: red
                    4278190080: 18  # effect: fast siren
        # Clear, then force basement_radon_led_alert to re-run so it can
        # immediately re-assert its own LED state if radon is still elevated
        # -- otherwise clearing here would blindly wipe an active radon
        # indicator on the 6 switches these two features share, and it
        # wouldn't come back until the next radon tier change.
        default:
          - service: zwave_js.bulk_set_partial_config_parameters
            target:
              device_id: "{{ alert_switches }}"
            data:
              parameter: 99
              value:
                4278190080: -1  # effect: clear
          - service: automation.trigger
            target:
              entity_id: automation.basement_radon_led_alert
            data:
              skip_condition: true
