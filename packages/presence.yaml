################################################################
## Packages / Presence
################################################################

################################################
## Customize
################################################

homeassistant:
  customize:
    ################################################
    ## Node Anchors
    ################################################

    package.node_anchors:
      customize: &customize
        package: 'presence'

      expose: &expose
        <<: *customize
        homebridge_hidden: true

    ################################################
    ## Automation
    ################################################

    automation.person_arriving:
      <<: *expose
      friendly_name: "Mark person as just arrived"
      icon: mdi:map-marker

    automation.person_home:
      <<: *expose
      friendly_name: "Mark person as home"
      icon: mdi:map-marker

    automation.person_departing:
      <<: *expose
      friendly_name: "Mark person as just left"
      icon: mdi:map-marker

    automation.person_away:
      <<: *expose
      friendly_name: "Mark person as away"
      icon: mdi:map-marker

    automation.person_vacation:
      <<: *expose
      friendly_name: "Mark person as extended away"
      icon: mdi:map-marker

    ################################################
    ## Person
    ################################################

    person.julia:
      <<: *customize
      entity_picture: /local/img/julia.jpg
      status_select: input_select.julias_status

    person.michael:
      <<: *customize
      entity_picture: /local/img/michael.jpg
      status_select: input_select.michaels_status

    ################################################
    ## Input Select
    ################################################

    input_select.julias_status:
      <<: *customize
      friendly_name: "Julia"
      entity_picture: /local/img/julia.jpg

    input_select.michaels_status:
      <<: *customize
      friendly_name: "Michael"
      entity_picture: /local/img/michael.jpg

    ################################################
    ## Sensor
    ################################################

    sensor.household:
      <<: *customize
      friendly_name: "Household"

################################################
## Input Select
################################################

input_select:
  julias_status:
    options:
      - Home
      - Arriving
      - Departing
      - Away
      - Vacation

  michaels_status:
    options:
      - Home
      - Arriving
      - Departing
      - Away
      - Vacation

################################################
## Template Sensor
################################################

template:
  - sensor:
      default_entity_id: sensor.household
      # Membership driven by the 'household_member' label (filtered to the
      # input_select.*_status half of it) rather than hardcoding each
      # person's status entity -- see the automation comment above for why.
      state: >-
          {% set statuses = expand(label_entities('household_member') | select('match', '^input_select\.') | list) %}
          {% if statuses | selectattr('state', 'eq', 'Home') | list | count > 0 %}
            Home
          {% elif statuses | selectattr('state', 'eq', 'Arriving') | list | count > 0 %}
            Arriving
          {% elif statuses | selectattr('state', 'eq', 'Departing') | list | count > 0 %}
            Departing
          {% elif statuses | count > 0 and statuses | selectattr('state', 'eq', 'Vacation') | list | count == statuses | count %}
            Vacation
          {% else %}
            Away
          {% endif %}
      icon: >-
          {% set household_status = states('sensor.household') %}
          {% if household_status == 'Home' or household_status == 'Arriving' %}
            mdi:map-marker-radius
          {% elif household_status == 'Vacation' %}
            mdi:beach
          {% else %}
            mdi:car
          {% endif %}

################################################
## Automation
################################################

automation presence:
  # Membership driven by the 'household_member' label (applied to both a
  # person's person.* entity and their input_select.*_status entity) rather
  # than listing each person by name -- adding a new household member only
  # means creating their person/input_select pair, linking them via the
  # status_select customize attribute below, and labeling both. No
  # automation here needs editing.
  #
  # A plain state trigger can't take a label (entity_id has to be a literal
  # list), so this is the same generic state_changed event + label-
  # membership condition pattern used throughout alarm.yaml.
  - alias: person_arriving
    id: person_arriving
    mode: parallel
    initial_state: true
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in label_entities('household_member')
             and trigger.event.data.entity_id is match('^person\.')
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state == 'home'
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state != 'home') }}
    action:
      - service: input_select.select_option
        data_template:
          entity_id: "{{ state_attr(trigger.event.data.entity_id, 'status_select') }}"
          option: >-
            {% if is_state(state_attr(trigger.event.data.entity_id, 'status_select'), 'Departing') %}
              Home
            {% else %}
              Arriving
            {% endif %}

  # No 'for: minutes: 10' equivalent on a generic event trigger, and a plain
  # delay + recheck isn't equivalent either -- it only looks at the state at
  # the two endpoints, not whether it held continuously in between, so it'd
  # wrongly fire if the status left 'Arriving' and came back before the
  # window elapsed.
  #
  # wait_for_trigger can't help here either -- its nested trigger's entity_id
  # is validated at config-setup time, same as a top-level state trigger, so
  # a template there ("Entity ... is neither a valid entity ID nor a valid
  # UUID... Got None") fails before the automation ever runs. wait_template
  # doesn't have that restriction (it's a plain template, not a trigger
  # config) and gives the same continuously-held semantics: it re-evaluates
  # reactively as the entity changes, so a genuine timeout (wait.completed
  # is false) proves the state never left 'Arriving' the whole time, while
  # completing early proves it did and this should abort.
  - alias: person_home
    id: person_home
    mode: parallel
    initial_state: true
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in label_entities('household_member')
             and trigger.event.data.entity_id is match('^input_select\.')
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state == 'Arriving'
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state != 'Arriving') }}
    action:
      - wait_template: "{{ not is_state(trigger.event.data.entity_id, 'Arriving') }}"
        timeout:
          minutes: 10
        continue_on_timeout: true
      - condition: template
        value_template: "{{ not wait.completed }}"
      - service: input_select.select_option
        data_template:
          entity_id: "{{ trigger.event.data.entity_id }}"
          option: 'Home'

  - alias: person_departing
    id: person_departing
    mode: parallel
    initial_state: true
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in label_entities('household_member')
             and trigger.event.data.entity_id is match('^person\.')
             and trigger.event.data.old_state is not none
             and trigger.event.data.old_state.state == 'home'
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state != 'home' }}
    action:
      - service: input_select.select_option
        data_template:
          entity_id: "{{ state_attr(trigger.event.data.entity_id, 'status_select') }}"
          option: 'Departing'

  - alias: person_away
    id: person_away
    mode: parallel
    initial_state: true
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in label_entities('household_member')
             and trigger.event.data.entity_id is match('^input_select\.')
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state == 'Departing'
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state != 'Departing') }}
    action:
      - wait_template: "{{ not is_state(trigger.event.data.entity_id, 'Departing') }}"
        timeout:
          minutes: 10
        continue_on_timeout: true
      - condition: template
        value_template: "{{ not wait.completed }}"
      - service: input_select.select_option
        data_template:
          entity_id: "{{ trigger.event.data.entity_id }}"
          option: 'Away'

  - alias: person_vacation
    id: person_vacation
    mode: parallel
    initial_state: true
    trigger:
      - platform: event
        event_type: state_changed
    condition:
      - condition: template
        value_template: >
          {{ trigger.event.data.entity_id in label_entities('household_member')
             and trigger.event.data.entity_id is match('^input_select\.')
             and trigger.event.data.new_state is not none
             and trigger.event.data.new_state.state == 'Away'
             and (trigger.event.data.old_state is none
                  or trigger.event.data.old_state.state != 'Away') }}
    action:
      - wait_template: "{{ not is_state(trigger.event.data.entity_id, 'Away') }}"
        timeout:
          hours: 24
        continue_on_timeout: true
      - condition: template
        value_template: "{{ not wait.completed }}"
      - service: input_select.select_option
        data_template:
          entity_id: "{{ trigger.event.data.entity_id }}"
          option: 'Vacation'
